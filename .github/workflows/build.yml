name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign release APK with generated keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias uvc -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass uvcmonitor -keypass uvcmonitor -dname "CN=UVC Monitor, OU=youyoudezhuzhu, O=youyoudezhuzhu, L=NA, S=NA, C=CN" > /dev/null 2>&1
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          echo "using apksigner: $APKSIGNER"
          $APKSIGNER sign --ks release.keystore --ks-pass pass:uvcmonitor --key-pass pass:uvcmonitor \
            --out monmon/build/outputs/apk/release/uvc-monitor-signed.apk \
            monmon/build/outputs/apk/release/monmon-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uvc-monitor-debug
          path: monmon/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uvc-monitor-release
          path: monmon/build/outputs/apk/release/uvc-monitor-signed.apk
